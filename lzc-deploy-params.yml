params:
  - id: site_token
    type: secret
    name: "Site Token"
    description: "Dashboard and API token (min 8 characters, no whitespace). Auto-filled on the login page."
    default_value: "$random(len=20)"
    optional: false

  - id: ai_base_url
    type: string
    name: "AI Base URL"
    description: "Optional OpenAI-compatible API base URL. AI assistance stays disabled until this and the model are set."
    default_value: ""
    optional: true

  - id: ai_model
    type: string
    name: "AI Model"
    description: "Optional model identifier, for example gpt-4o-mini. AI stays disabled until base URL and model are set."
    default_value: ""
    optional: true

  - id: ai_api_key
    type: secret
    name: "AI API Key"
    description: "Optional AI provider key. May stay empty for local providers that do not require one."
    default_value: ""
    optional: true

locales:
